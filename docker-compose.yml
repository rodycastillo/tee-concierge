services:
  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+asyncpg://tee:tee@postgres:5432/tee
    depends_on:
      postgres: {condition: service_healthy}
  api:
    build: .
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+asyncpg://tee:tee@postgres:5432/tee
      REDIS_URL: redis://redis:6379/0
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
  worker:
    build: .
    command: ["arq", "tee_concierge.infrastructure.worker.WorkerSettings"]
    ports: ["9100:9100"]
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+asyncpg://tee:tee@postgres:5432/tee
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
  postgres:
    image: postgres:16-alpine
    environment: {POSTGRES_USER: tee, POSTGRES_PASSWORD: tee, POSTGRES_DB: tee}
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tee"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
volumes:
  pgdata:
