name: CI
on:
  push: {branches: [main]}
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with: {enable-cache: true}
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run lint-imports
      - run: uv run tee-menu validate examples/*/menu.yaml
      - run: uv run pytest --cov=tee_concierge --cov-fail-under=80
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t tee-concierge .
  e2e:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with: {enable-cache: true}
      - run: uv sync --frozen
      - run: cp .env.example .env
      - run: docker compose up --build -d
      - name: Load demo catalog
        run: docker compose exec -T api python -m tee_concierge.seed
      - name: Smoke test (signed webhook > queue > worker > Postgres)
        run: uv run python scripts/smoke_test.py
      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color
